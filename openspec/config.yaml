schema: spec-driven

context: |
  Pakka is a TypeScript/Node headless Pi integration with an optional WebUI.
  Start at docs/OVERVIEW.md and the relevant docs/state mappings.
  OpenSpec owns complete proposal/design/tasks/specs and archive lifecycle.
  docs/changes only summarizes and fully cites every related change and spec.
  State describes expectations; status and fixed evidence describe actual results.
  Public Pi SDK only; mutable native objects stay inside the durable adapter.
  Preserve original request identity, native steering and fail-closed unknown effects.
  Tests use real Pi and deterministic local providers, never user credentials.

rules:
  proposal:
    - Separate operator requirements, prior agreements, design reasoning and observations.
    - Do not infer acceptance or supported scope from implementation progress.
  design:
    - Preserve actual decision conditions and source/evidence references; do not invent earlier reasoning.
  specs:
    - Follow docs/state ownership mappings and retain exact authority and unknown-effect contracts.
    - Never trim or split existing normative text solely to eliminate validation warnings.
  tasks:
    - Keep missing, failing, cancelled and BLOCKED gates visible with candidate identity.

operations:
  archive:
    guidance:
      - Update docs/changes summaries to cite the archived change and every delta/resulting main spec.
      - Do not archive incomplete product acceptance just because implementation tasks are checked.
